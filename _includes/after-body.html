<div id="lightbox" onclick="this.style.display='none'" style="display:none; position:fixed; z-index:9999; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
  <img id="lightbox-img" src="" alt="enlarged image" style="max-width:90%; max-height:90%; box-shadow:0 0 20px white;">
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const masthead = document.querySelector('.press-masthead');
  const content = document.getElementById('quarto-content');
  if (masthead && content) content.before(masthead);
  const chapterNumber = document.querySelector('h1.title .chapter-number');
  if (chapterNumber && chapterNumber.nextSibling && chapterNumber.nextSibling.nodeType === Node.TEXT_NODE) {
    chapterNumber.nextSibling.textContent = '';
  }
});
</script>
