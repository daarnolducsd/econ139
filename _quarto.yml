      body-width: 680px
      sidebar-width: 205px
      margin-width: 170px
      gutter-width: 2rem
    fig-align: center
    include-before-body: _includes/masthead.html
    include-after-body: _includes/after-body.html
    js: lightbox.js
  pdf:
    documentclass: scrreprt



